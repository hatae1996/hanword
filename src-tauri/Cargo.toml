[package]
name = "hanword"
version = "1.3.0"
description = "한글(HWPX)과 Word(DOCX) 모두 호환되는 문서 편집기"
authors = ["HanWord"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hanword_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
percent-encoding = "2"
serde_json = "1" # generate_context! 가 plugins 설정을 담을 때 필요

# 인쇄: Windows 기본 인쇄 대화상자 (WebView2 ShowPrintUI) — tauri 가 쓰는 것과 같은 버전
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
