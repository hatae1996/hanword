[package]
name = "hanword"
version = "0.12.0"
description = "한글(HWPX)과 Word(DOCX) 모두 호환되는 문서 편집기"
authors = ["HanWord"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hanword_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
percent-encoding = "2"
serde_json = "1" # generate_context! 가 plugins 설정을 담을 때 필요

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
