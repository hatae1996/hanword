<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HanWord</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand" aria-label="HanWord">
          <span class="brand-mark" aria-hidden="true">한<span>W</span></span>
        </div>
        <label class="doc-title">
          <span class="sr-only">문서 제목</span>
          <input id="doc-title" type="text" value="" placeholder="문서 제목" spellcheck="false" />
        </label>
        <div class="file-actions">
          <button id="new-doc" class="btn ghost" type="button" title="새 문서 (Alt+N)">새 문서</button>
          <button id="templates" class="btn ghost" type="button" title="양식으로 새 문서: 결과 보고, 기록물 이관 완료 보고, 사진대지, 회의록, 내 양식">양식</button>
          <button id="open-doc" class="btn ghost" type="button" title="한글(.hwpx)·Word(.docx) 문서 열기 (Ctrl+O)">열기</button>
          <button id="recent-doc" class="btn ghost narrow" type="button" title="최근 문서" aria-label="최근 문서" hidden>최근 ▾</button>
          <button id="save-doc" class="btn ghost" type="button" title="저장 (Ctrl+S)">저장</button>
          <button id="print-doc" class="btn ghost" type="button" title="인쇄 (Ctrl+P) — 문서의 용지·여백·쪽 번호 그대로">인쇄</button>
          <button id="save-hwpx" class="btn save hwp" type="button" title="한컴오피스 한글에서 여는 파일로 저장">
            <span class="fmt">HWPX</span> 한글로 저장
          </button>
          <button id="save-docx" class="btn save word" type="button" title="Microsoft Word 에서 여는 파일로 저장">
            <span class="fmt">DOCX</span> Word로 저장
          </button>
        </div>
      </header>

      <div class="ribbon" role="toolbar" aria-label="서식">
        <div class="group">
          <button class="tb" data-cmd="undo" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소">↶</button>
          <button class="tb" data-cmd="redo" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행">↷</button>
        </div>
        <div class="group">
          <select id="block-type" class="sel" title="문단 종류" aria-label="문단 종류">
            <option value="p">본문</option>
            <option value="1">제목 1</option>
            <option value="2">제목 2</option>
            <option value="3">제목 3</option>
          </select>
          <select id="font-family" class="sel" title="글꼴" aria-label="글꼴"></select>
          <select id="font-size" class="sel narrow" title="글자 크기 (pt)" aria-label="글자 크기"></select>
          <button class="tb" data-cmd="size-down" title="글자 작게 (Ctrl+[)" aria-label="글자 작게">가<sub class="step">−</sub></button>
          <button class="tb" data-cmd="size-up" title="글자 크게 (Ctrl+])" aria-label="글자 크게">가<sup class="step">+</sup></button>
          <button class="tb" data-cmd="spacing-down" title="자간 좁게 (Alt+Shift+N) — 한글 보고서는 보통 -5%" aria-label="자간 좁게"><span class="sp-ico">가가</span><sub class="step">−</sub></button>
          <button class="tb" data-cmd="spacing-up" title="자간 넓게 (Alt+Shift+W)" aria-label="자간 넓게"><span class="sp-ico wide">가가</span><sup class="step">+</sup></button>
        </div>
        <div class="group">
          <button class="tb b" data-cmd="bold" title="굵게 (Ctrl+B)" aria-label="굵게">가</button>
          <button class="tb i" data-cmd="italic" title="기울임 (Ctrl+I)" aria-label="기울임">가</button>
          <button class="tb u" data-cmd="underline" title="밑줄 (Ctrl+U)" aria-label="밑줄">가</button>
          <button class="tb s" data-cmd="strike" title="취소선" aria-label="취소선">가</button>
          <button class="tb wide" data-cmd="format-copy" title="모양 복사 (Alt+C): 가져올 글자에서 한 번, 바꿀 곳을 선택하고 한 번 더. Esc 로 끝">모양 복사</button>
          <label class="tb color" title="글자 색" aria-label="글자 색">
            <span class="swatch" id="color-swatch">가</span>
            <input id="font-color" type="color" value="#000000" />
          </label>
        </div>
        <div class="group">
          <button class="tb" data-cmd="align-left" title="왼쪽 정렬" aria-label="왼쪽 정렬"><i class="ico al"></i></button>
          <button class="tb" data-cmd="align-center" title="가운데 정렬" aria-label="가운데 정렬"><i class="ico ac"></i></button>
          <button class="tb" data-cmd="align-right" title="오른쪽 정렬" aria-label="오른쪽 정렬"><i class="ico ar"></i></button>
          <button class="tb" data-cmd="align-justify" title="양쪽 정렬" aria-label="양쪽 정렬"><i class="ico aj"></i></button>
        </div>
        <div class="group">
          <button class="tb wide" data-cmd="bullet" title="글머리표" aria-label="글머리표">• 목록</button>
          <button class="tb wide" data-cmd="ordered" title="번호 목록" aria-label="번호 목록">1. 목록</button>
        </div>
        <div class="group">
          <button class="tb wide" data-cmd="page-number" title="쪽 번호 매기기 (Ctrl+N, P)">쪽 번호</button>
          <button class="tb wide" data-cmd="header-footer" title="머리말/꼬리말 (Ctrl+N, H)">머리말</button>
          <button class="tb wide" data-cmd="page-setup" title="편집 용지 (F7)">편집 용지</button>
          <button class="tb wide" data-cmd="para-shape" title="문단 모양 (Alt+T)">문단 모양</button>
        </div>
        <div class="group">
          <button class="tb wide" data-cmd="polish" title="문장 다듬기 (Ctrl+Shift+G): 고른 문단을 공문체(~함·~임)나 개조식 □○ 항목으로. AI 키를 넣으면 요약·제목·맞춤법도">다듬기</button>
          <button class="tb wide" data-cmd="parts" title="보고서 부품 넣기 — 줄 맨 앞에서 / 를 쳐도 됩니다 (상용구: 선택 후 Alt+I 등록, 준말 + Alt+I, 목록 Ctrl+F3)">/ 부품</button>
          <button class="tb wide" data-cmd="image" title="그림 넣기 (Ctrl+N, I) — 붙여넣기·끌어다 놓기도 됩니다. 두 번 누르면 크기 바꾸기">그림</button>
          <button class="tb wide" data-cmd="photo-sheet" title="사진대지: 사진 여러 장을 표에 2장씩 + 설명 칸">사진대지</button>
          <button class="tb wide" data-cmd="table" title="3×3 표 넣기">표 넣기</button>
          <div class="table-tools" id="table-tools" hidden>
            <button class="tb wide" data-cmd="row-after" title="아래에 줄 추가">줄+</button>
            <button class="tb wide" data-cmd="col-after" title="오른쪽에 칸 추가">칸+</button>
            <button class="tb wide" data-cmd="sum" title="합계: 더할 칸들과 합계 칸을 드래그해 선택하거나, 합계 칸에 커서를 두고 누르세요 (Ctrl+Shift+S · 가로 Ctrl+Shift+H · 세로 Ctrl+Shift+V)">∑ 합계</button>
            <button class="tb wide" data-cmd="avg" title="평균: 합계와 같은 방법 (Ctrl+Shift+A)">평균</button>
            <button class="tb wide" data-cmd="merge" title="선택한 셀 합치기">셀 합치기</button>
            <button class="tb wide" data-cmd="split" title="셀 나누기">나누기</button>
            <label class="tb wide cellcolor" title="선택한 칸의 배경색">
              <span class="chip" id="cell-color-chip"></span>칸 색
              <input id="cell-color" type="color" value="#DCE6F1" />
            </label>
            <button class="tb wide" data-cmd="cell-nocolor" title="칸 배경색 지우기">색 없음</button>
            <select id="cell-border" class="sel border-sel" title="선택한 칸의 테두리 (여러 칸을 드래그하면 바깥·안쪽 선을 따로 적용)" aria-label="칸 테두리">
              <option value="">테두리 ▾</option>
            </select>
            <button class="tb wide" data-cmd="row-del" title="줄 지우기">줄−</button>
            <button class="tb wide" data-cmd="col-del" title="칸 지우기">칸−</button>
            <button class="tb wide danger" data-cmd="table-del" title="표 지우기">표 지우기</button>
          </div>
        </div>
      </div>

      <div class="update-bar" id="update-bar" role="status" hidden>
        <span id="update-text"></span>
        <button id="update-now" class="btn save" type="button">지금 업데이트</button>
        <button id="update-later" class="btn ghost" type="button">나중에</button>
      </div>

      <div class="update-bar recover" id="recover-bar" role="status" hidden>
        <span id="recover-text"></span>
        <button id="recover-now" class="btn save" type="button">복구</button>
        <button id="recover-drop" class="btn ghost" type="button">버리기</button>
      </div>

      <div class="workspace">
      <aside class="navpane" id="navpane" aria-label="탐색 창" hidden></aside>
      <main class="desk" id="desk">
        <div class="findbar" id="findbar" role="search" hidden>
          <input id="find-input" type="text" placeholder="찾을 내용" aria-label="찾을 내용" spellcheck="false" />
          <span class="find-count" id="find-count"></span>
          <button type="button" id="find-prev" title="이전 (Shift+Enter)" aria-label="이전">↑</button>
          <button type="button" id="find-next" title="다음 (Enter)" aria-label="다음">↓</button>
          <span class="find-replace" id="find-replace-row">
            <input id="replace-input" type="text" placeholder="바꿀 내용" aria-label="바꿀 내용" spellcheck="false" />
            <button type="button" id="replace-one">바꾸기</button>
            <button type="button" id="replace-all">모두 바꾸기</button>
          </span>
          <button type="button" id="find-toggle-replace" title="바꾸기 (Ctrl+H)">바꾸기 ▾</button>
          <button type="button" id="find-close" title="닫기 (Esc)" aria-label="닫기">✕</button>
        </div>
        <div class="ruler" id="ruler" aria-hidden="true"></div>
        <article class="page" id="page">
          <div class="page-hf top" id="page-top" aria-hidden="true"><span class="l"></span><span class="c"></span><span class="r"></span></div>
          <div id="editor"></div>
          <div class="page-hf bottom" id="page-bottom" aria-hidden="true"><span class="l"></span><span class="c"></span><span class="r"></span></div>
        </article>
      </main>
      </div>

      <footer class="statusbar">
        <span id="stat-file">새 문서</span>
        <span class="dot" aria-hidden="true">·</span>
        <span id="stat-chars">0자</span>
        <button class="blanks" id="stat-blanks" type="button" title="다음 빈칸으로 (Tab)" hidden></button>
        <button class="blanks fmt" id="stat-fmt" type="button" title="눌러서 모양 복사 끝내기" hidden>모양 복사 중 · 선택 후 Alt+C · Esc</button>
        <span class="dot" aria-hidden="true">·</span>
        <span class="note">한글·Word 양쪽에서 똑같이 표현되는 기능만 제공합니다</span>
        <span class="toast" id="toast" role="status" aria-live="polite"></span>
        <button class="navtoggle" id="nav-toggle" type="button" title="탐색 창: 목차·찾기 결과 (장 제목을 끌어 순서 바꾸기)">탐색 창</button>
        <span class="zoom" role="group" aria-label="화면 배율">
          <button id="zoom-out" type="button" title="축소 (Ctrl+휠 아래, Ctrl+-)" aria-label="축소">−</button>
          <button id="zoom-reset" type="button" title="100% 로 (Ctrl+0)">100%</button>
          <button id="zoom-in" type="button" title="확대 (Ctrl+휠 위, Ctrl+=)" aria-label="확대">+</button>
        </span>
        <button class="version" id="app-version" type="button" title="업데이트 확인"></button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
