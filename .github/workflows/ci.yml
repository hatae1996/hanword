# 평소 올릴 때마다 빠르게 검사 (설치 파일은 만들지 않음)
name: 검사

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 배포는 Windows 에서 하므로 Windows 에서도 같은 테스트를 돌린다 (줄바꿈 차이 등)
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm run roundtrip
      # 실제 프로그램 검증 꾸러미: 스크립트 문법 + 실행 흐름 (이 가상 PC 에는 한글·Word 가 없어 두 검사는 건너뜀)
      - run: npm run samples
      - run: node scripts/make-verify-kit.mjs
      - name: 검증 꾸러미 스크립트 실행 확인
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\verify\windows\verify-in-office.ps1", [ref]$null, [ref]$errs)
          if ($errs.Count) { $errs; exit 1 }
          Expand-Archive dist-kit\HanWord-검증꾸러미.zip -DestinationPath kit-test
          # 사용자 PC 와 같은 Windows PowerShell 5.1 로 실행 (검증-실행.cmd 와 같은 방법)
          powershell -NoProfile -ExecutionPolicy Bypass -File .\kit-test\verify-in-office.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path .\kit-test\검증결과.txt)) { Write-Error "검증결과.txt 가 만들어지지 않았습니다"; exit 1 }
          Get-Content .\kit-test\검증결과.txt
      - name: 구형 .hwp 읽기 (변환기)
        run: |
          npm run build:cli
          node cli/hanword.mjs verify/fixtures/02-표.hwp -o kit-test/표.md

  # 데스크톱 앱(Rust) 이 Windows 에서 컴파일되는지 — 인쇄 대화상자처럼 Windows 전용 코드가 있어서
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm run samples
      - run: npm run roundtrip
      - name: AI 변환기 동작 확인
        run: |
          npm run build:cli
          node cli/hanword.mjs verify/fixtures/ai-보고서.md --both
          node cli/hanword.mjs verify/fixtures/ai-보고서.hwpx -o /tmp/back.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r verify/requirements.txt
      - run: python verify/verify.py
