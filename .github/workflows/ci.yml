# 평소 올릴 때마다 빠르게 검사 (설치 파일은 만들지 않음)
name: 검사

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 배포는 Windows 에서 하므로 Windows 에서도 같은 테스트를 돌린다 (줄바꿈 차이 등)
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm run roundtrip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm run samples
      - run: npm run roundtrip
      - name: AI 변환기 동작 확인
        run: |
          npm run build:cli
          node cli/hanword.mjs verify/fixtures/ai-보고서.md --both
          node cli/hanword.mjs verify/fixtures/ai-보고서.hwpx -o /tmp/back.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r verify/requirements.txt
      - run: python verify/verify.py
