# 새 버전 배포 — GitHub 의 Actions 탭 → "배포" → "Run workflow" 버튼으로 실행
#  1) 테스트 (타입 검사 · 저장→열기 왕복)
#  2) Windows 설치 파일 빌드 + 업데이트 서명
#  3) package.json 버전으로 태그(v0.3.0 등)와 GitHub Release 를 만들고 latest.json 갱신
#     → 사용자 앱이 켜질 때 업데이트 알림
#
# 필요한 저장소 Secret: TAURI_SIGNING_PRIVATE_KEY (업데이트 서명용 개인 키)
name: 배포

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: 타입 검사 · 왕복 테스트
        run: |
          npx tsc
          npm run roundtrip
      - name: 릴리스 노트 (CHANGELOG 맨 위 항목)
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<__END__'
            awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2
            echo '__END__'
          } >> "$GITHUB_OUTPUT"
      - name: 설치 파일 빌드 · 서명 · 릴리스 게시
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: 'HanWord v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis
      - name: AI 용 변환기(hanword.mjs)도 릴리스에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:cli
          node scripts/copy-rhwp.mjs
          npm run samples
          node scripts/make-verify-kit.mjs
          gh release upload "v$(node -p "require('./package.json').version")" cli/hanword.mjs public/rhwp/rhwp.js public/rhwp/rhwp_bg.wasm "dist-kit/HanWord-검증꾸러미.zip" --clobber
